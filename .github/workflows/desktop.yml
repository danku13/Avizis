# TACG — десктоп-сборка (Tauri, ADR-018) + релиз
#
#   push в main   → проверочная сборка Windows (артефакт во вкладке Artifacts)
#   push тега v*  → сборка + автоматическое создание GitHub Release с установщиком
#   workflow_dispatch → ручной запуск проверочной сборки
#
# Конвейер: bun install → сайдкар движка (bun build --compile) →
# статический экспорт UI (out/) → cargo/tauri build → NSIS-установщик + портативный zip.
name: Desktop (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Чекаут
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: Сайдкар движка (bun compile → Windows exe)
        run: bun run compile:engine:win

      - name: Фронтенд (статический экспорт out/)
        run: bun run build:static
        env:
          TACG_STATIC: '1'

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri build (NSIS-установщик)
        run: bunx tauri build

      - name: Портативная сборка (zip с оболочкой и сайдкаром)
        shell: pwsh
        run: |
          $files = @('src-tauri/target/release/tacg.exe')
          $sidecar = Get-ChildItem 'src-tauri/target/release' -Filter 'tacg-engine*' -ErrorAction SilentlyContinue
          if ($sidecar) { $files += $sidecar.FullName }
          Compress-Archive -Path $files -DestinationPath tacg-portable-windows-x64.zip
          Get-Item tacg-portable-windows-x64.zip | Select-Object Name, Length

      - name: Артефакты проверочной сборки
        uses: actions/upload-artifact@v4
        with:
          name: tacg-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            tacg-portable-windows-x64.zip
          if-no-files-found: error

      - name: GitHub Release (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            tacg-portable-windows-x64.zip
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
