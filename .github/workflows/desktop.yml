# TACG — десктоп-сборка (Tauri, ADR-018) + релиз
#
#   push в main   → проверочная сборка Windows (артефакт во вкладке Artifacts)
#   push тега v*  → сборка + автоматическое создание GitHub Release с установщиком
#   workflow_dispatch → ручной запуск проверочной сборки
#
# Конвейер: bun install → сайдкар движка (bun build --compile) →
# статический экспорт UI (out/) → cargo/tauri build → NSIS-установщик + портативный zip.
name: Desktop (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Чекаут
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Зависимости
        run: |
          bun install --frozen-lockfile
          # движок — отдельный пакет (socket.io, z-ai-web-dev-sdk в своих node_modules)
          cd mini-services/tacg-agent && bun install

      - name: Сайдкар движка (bun compile → Windows exe)
        run: bun run compile:engine:win

      - name: Фронтенд (статический экспорт out/)
        run: bun run build:static
        env:
          TACG_STATIC: '1'

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri build (NSIS-установщик)
        run: bunx tauri build

      - name: Портативная сборка (zip с оболочкой, сайдкаром и README)
        shell: pwsh
        run: |
          $rel = 'src-tauri/target/release'
          # tauri копирует сайдкар без тройки целевой платформы; если нет — приводим сами
          if (-not (Test-Path "$rel/tacg-engine.exe") -and (Test-Path "$rel/tacg-engine-x86_64-pc-windows-msvc.exe")) {
            Copy-Item "$rel/tacg-engine-x86_64-pc-windows-msvc.exe" "$rel/tacg-engine.exe"
          }
          if (-not (Test-Path "$rel/tacg.exe") -or -not (Test-Path "$rel/tacg-engine.exe")) {
            Write-Error "нет компонентов портативной сборки: tacg.exe / tacg-engine.exe"; exit 1
          }
          # README внутри архива (ADR-021): запуск без установки, WebView2, данные, обновления
          $readme = @'
          TACG — портативная версия (без установки)

          1. Распакуйте архив в любую папку и запустите tacg.exe.
          2. Требуется Microsoft WebView2 (обычно уже установлен в Windows 10/11;
             иначе скачайте с официального сайта Microsoft).
          3. Данные (история прогонов, ключи LLM) хранятся в каталоге приложения ОС
             и переживают обновления; удаление папки приложения их не удаляет.

          Обновление: приложение само проверяет GitHub Releases при старте и предлагает
          обновиться (значок в правом нижнем углу) — скачает новую версию, заменит файлы
          рядом с tacg.exe и перезапустится. Установщик не нужен.
          '@
          Set-Content -Path portable-README.txt -Value $readme.TrimStart() -Encoding utf8
          Compress-Archive -Path "$rel/tacg.exe", "$rel/tacg-engine.exe", "portable-README.txt" -DestinationPath tacg-portable-windows-x64.zip
          Get-Item tacg-portable-windows-x64.zip | Select-Object Name, Length

      - name: Артефакты проверочной сборки
        uses: actions/upload-artifact@v4
        with:
          name: tacg-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            tacg-portable-windows-x64.zip
          if-no-files-found: error

      - name: GitHub Release (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            tacg-portable-windows-x64.zip
            download/tacg-demo.mp4
            download/tacg-demo-en.srt
            download/tacg-demo-ru.srt
            download/tacg-demo-preview.gif
            download/tacg-gifs/tacg-gif-*.gif
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
